# opt2 standard pipeline (template ci-v9.20).
# GENERATED from Tealbrick/opt2-tealbrick-platform: ci/woodpecker/ci.yaml.
# Do not edit this file in a repo: the "setup" step fails on any drift.
# Repo-specific settings go in tealbrick-ci.json. Change the standard in the platform repo.
# Clean-up: images are built by kaniko inside the step container (no host daemon images,
# no host socket, no privileged step); Woodpecker removes step containers and the workspace.
# ci-v9.20 (S1c): the registry signer indexes the host agent tarball (product `host`, kind `package`, tag `host-v<ver>` of
#   the CLI repo) for the host installer. Steps unchanged.
# ci-v9.19 (C308 S1): the registry signer pins own-server engines (Openship npm tarball + images by digest, kind `engine`) from
#   registry/engines.json (PR only). Steps unchanged.
# ci-v9.18 (C274): release-record (and the registry signer) load manifest 0.1.30 + spec 0.1.57, so a manifest that declares
#   `events` (spec 0.1.57, MANIFEST §16) validates; every indexed app manifest re-validates unchanged. Steps unchanged.
# ci-v9.17 (L68): boot smoke of the built miniapp. The pre-release step runs a second command, `boot-smoke`: kind miniapp only, it starts the
#   built entry (package.json main, else dist/main.js; no rebuild) and requires a healthy answer of the manifest health path. No secret.
# ci-v9.16 (C278): Governance (fleet) leaves DEV_ONLY_PRODUCTS (signer only; promotion reads the current list). Steps unchanged.
# ci-v9.15 (C249): opt2-tealbrick-live-artifacts joins OPT2_REPOS (public; registry-sync + template audit). FIX: ci-v9.14 does not
#   parse in Woodpecker (osv-scan printf had ": " in a plain YAML list item = a map, not a string). Do not adopt ci-v9.14.
# ci-v9.14 (C262): OSV vulnerability scan. New steps osv-scan (osv-scanner image pinned by digest; scans the pnpm/npm lockfiles that setup
#   listed; osv.dev is the only network use; no secret) and osv-check (this runner judges the report: HIGH/CRITICAL/unknown severity fails
#   unless tealbrick-ci.json osvIgnore covers it). Both run beside install; pre-release (and so image-check and release-record) waits for
#   osv-check.
# ci-v9.3: the steps form an explicit graph (depends_on on every step), in the same order as before. Only the opt-in
# postgres step runs beside the unit step instead of in front of it (see the postgres step).
# ci-v9.11 (C232): the release workflow of a "releaseOn": "woodpecker" repo may also publish images (kaniko --no-push + crane push,
#   secret tb_ghcr_token, release-image-push step only); this file is unchanged apart from the template id.
# ci-v9.10 (C222): repos with "releaseOn": "woodpecker" (private repos) also carry .woodpecker/release.yaml, which runs
#   after this workflow on tags (and on a manual run with TB_RELEASE_TAG) and publishes the release; this file is unchanged.
# ci-v9.9 (C206 B6): TB_MANIFEST_PKG/TB_SPEC_PKG come from the dist host (the sdk and specs repos go private); bytes and
#   integrity unchanged.
# ci-v9.8 (C206): the opt2 repos live in the Tealbrick org: runner and template come from Tealbrick; images go to
#   ghcr.io/tealbrick.
# ci-v9.7: tealbrick-ci.json packScripts (release Action only; this pipeline is unchanged).
# ci-v9.6: new step pre-release (after gen) runs the repo's tealbrick-ci.json preReleaseChecks; image-check and release-record wait for it.
labels:
  platform: linux/amd64

when:
  - event: [pull_request, tag, manual]
  - event: push
    branch: main

steps:
  - name: secret-scan
    image: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
    depends_on: []
    commands:
      - gitleaks dir --redact --no-banner --verbose .

  - name: setup
    image: &node node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    depends_on: [secret-scan]
    environment: &env
      CI: "true"
      TB_CI_REF: ci-v9.20
      TB_CI_SHA256: "2234fb5cb5c4af224be056ab55a86f0515f2072e6d04f5aae66c0ad173b15db4"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
    commands:
      - mkdir -p .tb-ci
      - curl -fsSL "https://raw.githubusercontent.com/Tealbrick/opt2-tealbrick-platform/$TB_CI_REF/ci/tb-ci.ts" -o .tb-ci/tb-ci.ts
      - echo "$TB_CI_SHA256  .tb-ci/tb-ci.ts" | sha256sum -c -
      - node .tb-ci/tb-ci.ts setup

  - name: install
    image: *node
    depends_on: [setup]
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts install

  # ci-v9.14 (C262): OSV vulnerability scan of the lockfiles. Two steps, neither holds a secret. osv-scan runs osv-scanner (the image has
  # a shell but no node) on exactly the lockfiles that setup listed in .tb-ci/osv-lockfiles and writes .tb-ci/osv.json. osv-scanner
  # exits 0 (nothing found) or 1 (vulnerabilities found); every other status (127: osv.dev unreachable or a bad lockfile) FAILS the
  # step, so an unreachable osv.dev never reads as "clean". osv-check then runs this runner on the report (HIGH/CRITICAL/unknown
  # severity fails unless a valid osvIgnore entry covers it). --config points at a file this step writes, so a repo-owned
  # osv-scanner.toml (IgnoredVulns) is never read and cannot bypass the osvIgnore policy. To move the scanner: change the tag and digest together (use a release
  # at least 2 weeks old).
  - name: osv-scan
    image: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    depends_on: [setup]
    commands:
      - rm -f .tb-ci/osv.json
      - if [ ! -s .tb-ci/osv-lockfiles ]; then echo "osv-scan - no lockfile listed by setup; nothing to scan"; exit 0; fi
      - printf '# template-owned osv-scanner config (ci-v9.15) - no repo osv-scanner.toml is read - exceptions only via tealbrick-ci.json osvIgnore\n' > .tb-ci/osv-scanner.toml
      - set --; while IFS= read -r f; do set -- "$@" -L "./$f"; done < .tb-ci/osv-lockfiles
      - rc=0; /osv-scanner scan source --no-resolve --config .tb-ci/osv-scanner.toml --format json --output-file .tb-ci/osv.json "$@" || rc=$?
      - if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then echo "osv-scan FAILED (osv-scanner exit $rc) - osv.dev unreachable or a lockfile could not be read; a failed scan never counts as clean"; exit 1; fi
      - if [ ! -s .tb-ci/osv.json ]; then echo "osv-scan FAILED - osv-scanner wrote no report"; exit 1; fi

  - name: osv-check
    image: *node
    depends_on: [osv-scan]
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts osv-check .tb-ci/osv.json

  - name: typecheck
    image: *node
    depends_on: [install]
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run typecheck

  - name: lint
    image: *node
    depends_on: [typecheck]
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run lint

  # ci-v9.1: opt-in Postgres for tests. Starts only when tealbrick-ci.json has "postgres": true (setup writes
  # .tb-ci/postgres); otherwise it exits 0 at once. The unit step then gets TB_TEST_DATABASE_URL; tests skip when it is unset.
  # Ephemeral, no volume; removed with the pipeline.
  # ci-v9.3: a NORMAL step (not detached) that stops ITSELF. Woodpecker 3.19 ends every detached step (and every service) red
  # with "no such container" (exit 0) even when it stops cleanly, so ci-v9.1 and ci-v9.2 still showed a red step. The same
  # self-stopping script as a normal step ends green (portal-core's core-conformance workflow proved it). Woodpecker runs a graph
  # in stages (all steps whose dependencies are done start together; the next stage starts when ALL of them end), so this step has
  # the SAME depends_on as unit: the two run side by side in one stage. The runner writes .tb-ci/postgres-done when the unit step
  # ends (pass, fail or crash); the step then shuts Postgres down (TERM, KILL after 10 s) and exits 0. If install, typecheck or
  # lint fail, neither step starts (nothing to stop). The wait/exit status is ignored only here, for the cleanup; a database that
  # never came up still fails the unit step (waitForTcp). A 1 h cap stops the step if the unit step never writes the marker.
  - name: postgres
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    depends_on: [lint]
    environment:
      POSTGRES_USER: tb
      POSTGRES_PASSWORD: tb-ci-only
      POSTGRES_DB: tb
    commands:
      - if [ ! -f .tb-ci/postgres ]; then echo "postgres not requested (tealbrick-ci.json postgres=false); skipped"; exit 0; fi
      - DONE="$PWD/.tb-ci/postgres-done"
      - cd /
      - docker-entrypoint.sh postgres &
      - PG=$!
      - n=0
      - while [ ! -f "$DONE" ] && kill -0 "$PG" 2>/dev/null && [ "$n" -lt 3600 ]; do n=$((n+1)); sleep 1; done
      - echo "postgres cleanup (unit step done or cap reached after $n s)"
      - kill -TERM "$PG" 2>/dev/null || true
      - k=0; while kill -0 "$PG" 2>/dev/null && [ "$k" -lt 10 ]; do k=$((k+1)); sleep 1; done
      - kill -KILL "$PG" 2>/dev/null || true
      - wait "$PG" || echo "postgres exit status $? (ignored, cleanup only)"

  - name: unit
    image: *node
    depends_on: [lint]
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run test

  - name: conformance
    image: *node
    depends_on: [unit]
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run conformance

  - name: build
    image: *node
    depends_on: [conformance]
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run build
      - node .tb-ci/tb-ci.ts plan-images

  # BSA-03: generated artefacts (openapi, kit, docs, railway) from the manifest. Required for kind miniapp.
  - name: gen
    image: *node
    depends_on: [build]
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts gen

  # ci-v9.6: release gate. Runs the repo's `preReleaseChecks` (tealbrick-ci.json: repo-relative .ts scripts, `node <file>`, no tokens) on
  # EVERY pipeline, so a green pipeline means the gate passed before anyone tags (tag only on green, L10). gh-build runs the same checks
  # again on the tag before it builds. A repo without preReleaseChecks gets a green no-op. This is how a repo adds its own gate
  # (for example scripts/release-gate.ts) without editing this frozen template.
  - name: pre-release
    image: *node
    depends_on: [gen, osv-check]
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts pre-release
      - node .tb-ci/tb-ci.ts boot-smoke

  # Pull requests, pushes and manual runs: build every declared image, never push.
  - name: image-check
    image: &kaniko gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    depends_on: [pre-release]
    commands:
      - sh .tb-ci/images.sh
    when:
      - event: [pull_request, push, manual]

  # ---- Release (C72): images, kits and package tarballs are published by the GitHub Actions workflow
  # .github/workflows/opt2-release.yml (built-in GITHUB_TOKEN, no personal token) in public repos. This workflow holds NO secret.
  # ci-v9.10 (C222): private repos publish with .woodpecker/release.yaml instead (its publish step alone reads tb_release_token;
  # ci-v9.11 (C232): its image-push step alone reads tb_ghcr_token).

  # Release tags (v*): validate and print the release. No token, no signing key; the manifest package is hash-checked.
  # The platform registry-sync pipeline discovers the tag, resolves the image digests in ghcr and signs the index.
  - name: release-record
    image: *node
    depends_on: [pre-release]
    environment:
      CI: "true"
      TB_CI_SHA256: "2234fb5cb5c4af224be056ab55a86f0515f2072e6d04f5aae66c0ad173b15db4"
      TB_MANIFEST_PKG: https://github.com/Tealbrick/opt2-tealbrick-dist/releases/download/opt2-tealbrick-sdk-manifest-v0.1.30/opt2-tealbrick-manifest-0.1.30.tgz
      TB_MANIFEST_INTEGRITY: sha512-Jym8WSYaJ3IFJAnBc7bflJULt5g1ZXbtJaB1kLMmlqzL5oKLv/kgBrN4gTpJQ26aBYRco7uZ5+qbbRQDCI6X3g==
      # ci-v9.3: the manifest package depends on @opt2-tealbrick/spec by a GitHub URL (no integrity). The runner installs this
      # exact tarball instead (npm override) and checks its sha512 before loading anything.
      # ci-v9.4: manifest 0.1.12 (holdFamily outward/identity, C107) with spec 0.1.20 (the manifest package asks for 0.1.18).
      # ci-v9.18 (C274): manifest 0.1.30 with spec 0.1.57 (manifest `events`, M-EV-1..4); all 170 indexed app manifests
      # re-validate with unchanged manifestDigest (dry run 2026-10-21).
      TB_SPEC_PKG: https://github.com/Tealbrick/opt2-tealbrick-dist/releases/download/opt2-tealbrick-specs-spec-v0.1.57/opt2-tealbrick-spec-0.1.57.tgz
      TB_SPEC_INTEGRITY: sha512-K7H049Ln2GSD4pk3jI429Xvfpa4djhFTrWbmumoftqqojR7xYxwCAwz7gCB5TWZE93/xIRzhQuB4fn1nayyGPA==
    commands:
      - cp .tb-ci/tb-ci.ts /tmp/tb-ci.ts
      - echo "$TB_CI_SHA256  /tmp/tb-ci.ts" | sha256sum -c -
      - node /tmp/tb-ci.ts release-record
    when:
      - event: tag
        ref: refs/tags/v*
